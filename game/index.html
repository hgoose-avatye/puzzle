<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Animal Rescue</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='14' width='80' height='76' rx='20' fill='%23f5a3b5'/%3E%3Ccircle cx='36' cy='48' r='7' fill='%233b3a36'/%3E%3Ccircle cx='64' cy='48' r='7' fill='%233b3a36'/%3E%3Cellipse cx='50' cy='66' rx='10' ry='7' fill='%23e2667f'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8f3; font-family: system-ui, -apple-system, sans-serif; touch-action: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 20px; font-weight: 700; color: #3b3a36; pointer-events: none; }
      #mute { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); min-width: 56px; min-height: 48px; font-size: 24px; padding: 0 12px; }
      #hearts { font-size: 21px; letter-spacing: 0; }
      #hud > div { background: rgba(255,255,255,.82); border-radius: 16px; padding: 4px 12px; }
      #hearts:empty { display: none; }
      #stageDots { display: flex; gap: 4px; margin-top: 4px; }
      #stageDots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(59,58,54,.18); }
      #stageDots i.done { background: #6cc24a; }
      #stageDots i.now { background: #f2b33d; box-shadow: 0 0 0 2px rgba(242,179,61,.35); }
      #banner { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 12px; background: rgba(255,248,232,.95); border-radius: 26px; padding: 14px 26px; font-size: 24px; font-weight: 800; color: #3b3a36; box-shadow: 0 6px 0 rgba(0,0,0,.12); pointer-events: none; animation: bannerIn 1.9s ease both; }
      #banner[hidden] { display: none; }
      #bannerIcon { font-size: 40px; }
      @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); } 15%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(.98); } }
      #interlude { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; }
      #interlude[hidden] { display: none; }
      .ilCard { background: #fff8e8; border-radius: 32px; padding: 30px 32px 26px; width: min(86vw, 360px); text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.15); animation: ilIn .45s cubic-bezier(.2,1.4,.4,1) both; }
      @keyframes ilIn { from { opacity: 0; transform: translateY(24px) scale(.92); } to { opacity: 1; transform: none; } }
      #ilIcon { font-size: 76px; line-height: 1.1; }
      #ilKicker { font-size: 17px; font-weight: 700; color: #8a7d62; margin-top: 6px; }
      #ilTitle { font-size: 30px; font-weight: 800; margin: 4px 0 8px; color: #3b3a36; }
      #ilSub { font-size: 18px; color: #6b6558; margin-bottom: 20px; line-height: 1.45; white-space: pre-line; }
      #ilBtn { background: #6cc24a; color: #fff; min-width: 180px; }
      #hud > div:first-child { max-width: calc(50% - 46px); }
      #stageLabel { font-size: 13px; line-height: 1.25; font-weight: 600; opacity: .75; margin-top: 2px; }
      #msg { position: fixed; top: 58px; left: 0; right: 0; text-align: center; font-size: 18px; font-weight: 600; color: #b3402f; min-height: 24px; pointer-events: none; text-shadow: 0 1px 0 #fff; }
      #bar { position: fixed; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; }
      button { min-height: 52px; min-width: 120px; font-size: 20px; font-weight: 700; border: 0; border-radius: 26px; background: #fff; color: #3b3a36; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
      button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
      #popup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(40,40,40,.35); }
      #popup[hidden] { display: none; }
      .card { background: #fff8e8; border-radius: 28px; padding: 28px 36px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.15); }
      #popupTitle { font-size: 34px; font-weight: 800; margin-bottom: 6px; }
      #popupSub { font-size: 18px; color: #6b6558; margin-bottom: 18px; }
      .tip { text-align: left; font-size: 18px; line-height: 1.45; margin: 0 0 10px; max-width: 300px; color: #3b3a36; }
      #popupBtn { background: #6cc24a; color: #fff; min-width: 160px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"><div><div id="levelLabel"></div><div id="stageLabel"></div><div id="stageDots"></div></div><div id="hearts"></div></div>
    <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
    <div id="msg"></div>
    <div id="bar"><button id="retry">다시 ↻</button><button id="hint">💡 힌트</button><button id="next" hidden>다음 ▶</button></div>
    <div id="banner" hidden><span id="bannerIcon"></span><span id="bannerText"></span></div>
    <div id="interlude" hidden><div class="ilCard"><div id="ilIcon"></div><div id="ilKicker"></div><div id="ilTitle"></div><div id="ilSub"></div><button id="ilBtn"></button></div></div>
    <div id="popup" hidden><div class="card"><div id="popupTitle"></div><div id="popupSub"></div><button id="popupBtn"></button></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
