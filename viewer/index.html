<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puzzle Level Viewer</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; background: #faf7f2; color: #333; }
      #tester { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 8px; }
      #roleInfo { margin-bottom: 12px; color: #666; min-height: 1.2em; }
      #controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 12px; }
      label { display: flex; flex-direction: column; font-size: 12px; }
      input { width: 56px; padding: 4px; }
      select { padding: 4px; }
      button { padding: 6px 14px; }
      #layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
      canvas { background: #fff; border: 1px solid #ddd; cursor: pointer; max-width: 100%; touch-action: manipulation; }
      pre { margin: 0; line-height: 1.6; }
      #status { font-weight: 600; margin-top: 8px; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div id="tester">
      <label>level<input id="level" type="number" value="1" min="1" /></label>
      <button id="playLevel">Play level</button>
      <button id="nextLevel">Next level</button>
      <button id="copyLog">Copy log</button>
      <button id="clearLog">Clear log</button>
      <span id="logInfo"></span>
    </div>
    <div id="roleInfo"></div>
    <div id="controls">
      <label>seed<input id="seed" type="number" value="1" /></label>
      <label>preset<select id="preset"><option value="8x12" selected>8x12</option><option value="7x10">7x10</option><option value="10x10">10x10</option><option value="">custom</option></select></label>
      <label>style<select id="style"><option value="arrows" selected>arrows</option><option value="blocks">blocks</option></select></label>
      <label>width<input id="width" type="number" value="8" /></label>
      <label>height<input id="height" type="number" value="12" /></label>
      <label>pieces<input id="count" type="number" value="22" /></label>
      <label>min len<input id="minLen" type="number" value="1" /></label>
      <label>max len<input id="maxLen" type="number" value="3" /></label>
      <button id="generate">Generate</button>
    </div>
    <div id="layout">
      <div>
        <canvas id="board"></canvas>
        <div id="status"></div>
      </div>
      <pre id="metrics"></pre>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
